version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: peerlume_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_password_2026!}
      POSTGRES_DB: ${POSTGRES_DB:-peerlume}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: peerlume_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_secure_password_2026!}@postgres:5432/${POSTGRES_DB:-peerlume}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-peerlume_prod_jwt_access_secret_super_secure_32chars!}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-peerlume_prod_jwt_refresh_secret_super_secure_32chars!}
      COOKIE_SECRET: ${COOKIE_SECRET:-peerlume_prod_cookie_secret_super_secure_32chars!}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-development}
      EMAIL_FROM: ${EMAIL_FROM:-PeerLearn <noreply@peerlearn.edu>}
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: peerlume_web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"

volumes:
  postgres_data:
