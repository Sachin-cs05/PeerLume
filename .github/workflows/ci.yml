name: PeerLume CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-test:
    name: Build, Lint, Typecheck & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password123
          POSTGRES_DB: peerlume_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: "postgresql://postgres:password123@localhost:5432/peerlume_test?schema=public"
      JWT_ACCESS_SECRET: "ci_test_jwt_access_secret_super_secure_32chars!"
      JWT_REFRESH_SECRET: "ci_test_jwt_refresh_secret_super_secure_32chars!"
      COOKIE_SECRET: "ci_test_cookie_secret_super_secure_32chars!"
      WEB_ORIGIN: "http://localhost:5173"
      APP_BASE_URL: "http://localhost:5173"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma Schema & Generate Client
        run: |
          npm run prisma:validate
          npm run prisma:generate

      - name: Run Typecheck across monorepo
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

      - name: Run Vitest automated test suite
        run: npm run test

      - name: Run Production Builds
        run: npm run build
